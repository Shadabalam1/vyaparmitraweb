  <body class="bg-white text-slate-800 font-sans antialiased selection:bg-emerald-100 selection:text-emerald-900">
    <!-- Netlify Forms prerender definitions for React SPA -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="text" name="contactInfo" />
      <input type="text" name="businessType" />
      <textarea name="message"></textarea>
    </form>
    <form name="launch-notify" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="launch-notify" />
      <input type="text" name="notifyInput" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
